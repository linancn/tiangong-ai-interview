services:
  postgres:
    image: postgres:18-alpine
    container_name: tiangong-interview-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tiangong_interview
      POSTGRES_USER: tiangong
      POSTGRES_PASSWORD: tiangong_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tiangong -d tiangong_interview"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tiangong-interview-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgres://tiangong:tiangong_password@postgres:5432/tiangong_interview
    ports:
      - "3001:3001"
    volumes:
      - ./config.toml:/app/config.toml:ro

volumes:
  postgres_data:
